<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إتمام الطلب | Délicea</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="order-header">

<a href="index.html" class="back-btn">
← العودة
</a>

<h1>إتمام الطلب</h1>

</header>



<section class="order-page">

<div class="product-card">

<img id="packImage" src="" alt="Pack">

<h2 id="packName"></h2>

<p id="packWeight"></p>

<h3 id="packPrice"></h3>

</div>



<form id="orderForm">

<h2>معلومات الزبون</h2>

<input
type="text"
id="firstName"
placeholder="الاسم"
required>

<input
type="text"
id="lastName"
placeholder="اللقب"
required>

<input
type="tel"
id="phone"
placeholder="رقم الهاتف"
required>



<h2>عنوان التوصيل</h2>

<select id="wilayaSelect"></select>

<select id="communeSelect"></select>

<select id="deliveryType">

<option value="domicile">
التوصيل إلى المنزل
</option>

<option value="bureau">
مكتب التوصيل
</option>

</select>

<textarea
id="address"
placeholder="العنوان الكامل">
</textarea>



<div class="summary">

<h2>ملخص الطلب</h2>

<p>

سعر الباقة

<span id="priceValue">
0
</span>

دج

</p>

<p>

سعر التوصيل

<span id="deliveryValue">
0
</span>

دج

</p>

<p class="total">

المجموع

<span id="totalValue">
0
</span>

دج

</p>

</div>



<button
type="button"
class="confirm-btn"
onclick="sendOrder()">

اطلب الآن

</button>

</form>

</section>



<script src="pack.js"></script>

<script src="Wilaya.js"></script>

<script src="Communes.js"></script>

<script src="Delivery.js"></script>

<script src="script.js"></script>

</body>

</html>
